name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install mkdocs-material mkdocs-print-site-plugin mkdocs-glightbox playwright

      - name: Install Chromium for PDF generation
        run: playwright install chromium --with-deps

      - name: Build MkDocs site
        run: mkdocs build

      - name: Generate PDF from print page
        run: |
          python -m http.server 8000 --directory site &
          sleep 3
          python - <<'EOF'
          from playwright.sync_api import sync_playwright

          header = """
            <div style="font-size:8px;color:#666;width:100%;padding:4px 18mm;
                        border-bottom:1px solid #ddd;box-sizing:border-box;">
              Building an MCP Server with SAP Integration Suite
            </div>"""

          footer = """
            <div style="font-size:8px;color:#666;width:100%;padding:4px 18mm;
                        border-top:1px solid #ddd;box-sizing:border-box;
                        display:flex;justify-content:space-between;">
              <span>SAP BTP Trial Tutorial</span>
              <span><span class="pageNumber"></span> / <span class="totalPages"></span></span>
            </div>"""

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto("http://localhost:8000/print_page/", wait_until="networkidle")
              page.pdf(
                  path="site/tutorial.pdf",
                  format="A4",
                  print_background=True,
                  display_header_footer=True,
                  header_template=header,
                  footer_template=footer,
                  margin={"top": "25mm", "bottom": "22mm", "left": "15mm", "right": "15mm"},
              )
              browser.close()
          print("PDF generated: site/tutorial.pdf")
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
