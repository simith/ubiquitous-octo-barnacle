site_name: Building an MCP Server with SAP Integration Suite
site_description: >
  Step-by-step tutorial for building and connecting an MCP Server
  using SAP Integration Suite on SAP BTP Trial.

# Update this to match your GitHub username and repository name:
# site_url: https://<your-github-username>.github.io/sap-integration-suite-mcp-tutorial/

docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  palette:
    - scheme: default
      primary: blue
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: README.md
  - Tutorial:
    - 0. Introduction: 00-introduction.md
    - 1. Prerequisites: 01-prerequisites.md
    - 2. Build MCP Server: 02-build-mcp-server.md
    - 3. Govern & Deploy: 03-govern-and-deploy.md
    - 4. Connect AI Clients: 04-connect-ai-clients.md
    - 5. End-to-End Checklist: 05-end-to-end-checklist.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - glightbox
  - print-site:
      add_to_navigation: true
      print_page_title: "Print / Save as PDF"
      add_print_site_banner: false
      path_to_pdf: ""
      include_css: true

extra_css:
  - stylesheets/print.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com
