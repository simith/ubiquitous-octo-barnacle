site_name: Building an MCP Server with SAP Integration Suite
site_description: >
  Step-by-step tutorial for building and connecting an MCP Server
  using SAP Integration Suite on SAP BTP Trial.

# Update this to match your GitHub username and repository name:
# site_url: https://<your-github-username>.github.io/sap-integration-suite-mcp-tutorial/

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/server-network
  palette:
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - navigation.progress
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow

nav:
  - Home: README.md
  - Tutorial:
    - 0. Introduction: 00-introduction.md
    - 1. Prerequisites: 01-prerequisites.md
    - 2. Build MCP Server: 02-build-mcp-server.md
    - 3. Publish to Developer Hub: 03-govern-and-deploy.md
    - 4. Subscribe via Developer Hub: 04-connect-ai-clients.md
    - 5. End-to-End Checklist: 05-end-to-end-checklist.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - abbr
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - attr_list
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - glightbox
  - print-site:
      add_to_navigation: false
      print_page_title: "Print / Save as PDF"
      add_print_site_banner: false
      path_to_pdf: ""
      include_css: false

extra_css:
  - stylesheets/extra.css
  - stylesheets/print.css

extra_javascript:
  - javascripts/search-utils.js
  - javascripts/progress.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com
